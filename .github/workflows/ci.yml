name: TMS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://ci.invalid/neondb/auth
      NEXT_PUBLIC_NEON_AUTH_URL: https://ci.invalid/neondb/auth
      NEON_AUTH_COOKIE_SECRET: tms-ci-only-cookie-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Smoke-test current production release
        env:
          TMS_PRODUCTION_URL: https://teacher-management-system-nine.vercel.app
          TMS_EXPECT_TEACHER_AI_AUTH: ${{ github.event_name != 'pull_request' }}
          TMS_EXPECT_PASSWORD_RESET_PUBLIC: ${{ github.event_name != 'pull_request' }}
          TMS_EXPECT_TEACHER_OFFLINE_PUBLIC: ${{ github.event_name != 'pull_request' }}
          TMS_EXPECT_TEACHER_EMAIL_ASSIGNMENT: ${{ github.event_name != 'pull_request' }}
        run: node scripts/production-smoke.mjs
