name: TMS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://ci.invalid/neondb/auth
      NEXT_PUBLIC_NEON_AUTH_URL: https://ci.invalid/neondb/auth
      NEON_AUTH_COOKIE_SECRET: tms-ci-only-cookie-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Commit generated npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add npm dependency lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
