name: TMS CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://ci.invalid/neondb/auth
      NEON_AUTH_COOKIE_SECRET: tms-ci-only-cookie-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
