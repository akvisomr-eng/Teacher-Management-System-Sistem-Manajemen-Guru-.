name: TMS Production Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

concurrency:
  group: tms-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production availability and access controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production smoke checks
        env:
          TMS_PRODUCTION_URL: https://teacher-management-system-nine.vercel.app
          TMS_EXPECT_TEACHER_AI_AUTH: ${{ github.event_name != 'pull_request' }}
          TMS_EXPECT_PASSWORD_RESET_PUBLIC: ${{ github.event_name != 'pull_request' }}
        run: node scripts/production-smoke.mjs
